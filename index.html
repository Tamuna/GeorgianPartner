<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Georgian Partner</title>
    <style>
      :root {
        color-scheme: light;
      }

      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #f7f7f7 0%, #eef7ff 100%);
        color: #1f2937;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1rem;
      }

      .card {
        width: min(100%, 720px);
        background: white;
        border-radius: 20px;
        box-shadow: 0 12px 32px rgba(15, 23, 42, 0.12);
        padding: 2rem;
      }

      h1 {
        margin: 0 0 0.5rem;
        font-size: 2rem;
      }

      p {
        margin: 0;
        line-height: 1.6;
        color: #4b5563;
      }

      .choices {
        display: grid;
        gap: 1rem;
        margin-top: 1.5rem;
      }

      .choice {
        display: block;
        padding: 1rem 1.1rem;
        border-radius: 14px;
        border: 1px solid #dbeafe;
        background: #f8fbff;
        color: #0f172a;
        text-decoration: none;
      }

      .choice strong {
        display: block;
        margin-bottom: 0.35rem;
        font-size: 1.05rem;
      }

      .choice span {
        color: #4b5563;
        font-size: 0.95rem;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Georgian Partner</h1>
      <p>Choose how you want to practice today.</p>

      <div class="choices">
        <a class="choice" href="src/alphabet/index.html">
          <strong>1. Learn the alphabet</strong>
          <span>Go through the letters with pictures, simple words, and gentle guidance.</span>
        </a>

        <a class="choice" href="src/words/index.html">
          <strong>2. Already know the alphabet? Learn new words</strong>
          <span>Jump straight to the Georgian-English word pairs from before.</span>
        </a>
      </div>
    </main>
  </body>
</html>
